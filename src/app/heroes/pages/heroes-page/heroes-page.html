<mat-card appearance="outlined" class="heroes-card">
  <mat-card-header class="heroes-card-header">
    <mat-card-title>Superhéroes</mat-card-title>
    <mat-card-subtitle>Administra los héroes registrados</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="heroes-card-content">
    <div class="heroes-actions-bar">
      <mat-form-field class="search-field" appearance="outline">
        <mat-label>Buscar héroe por nombre</mat-label>
        <mat-icon matPrefix class="search-icon">search</mat-icon>
        <input matInput #searchTxt autocomplete="off"
          (input)="heroesService.onChangeSearchString(searchTxt.value)">
        @if (heroesService.searchString()) {
        <button matIconButton matSuffix type="button" aria-label="Limpiar búsqueda" (click)="clearSearch(searchTxt)">
          <mat-icon>close</mat-icon>
        </button>
        }
      </mat-form-field>

      <button matButton="filled" type="button" class="create-hero-button" (click)="onCreateButton()">
        <mat-icon>add</mat-icon>
        Crear un héroe
      </button>
    </div>

    <div class="table-responsive-container">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="power">
          <th mat-header-cell *matHeaderCellDef> Poder </th>
          <td mat-cell *matCellDef="let element"> {{element.power}} </td>
        </ng-container>

        <ng-container matColumnDef="universe">
          <th mat-header-cell *matHeaderCellDef> Universo </th>
          <td mat-cell *matCellDef="let element"> {{element.universe}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let element">
            <button (click)="onEditButton(element)" matIconButton>
              <mat-icon>edit</mat-icon>
            </button>
            <button (click)="onDeleteButton(element)" matIconButton>
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>

      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Paginación de superhéroes">
      </mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
